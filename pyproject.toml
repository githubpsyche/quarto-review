[project]
name = "quarto-review"
version = "0.3.2"
description = "Review Quarto manuscripts with comments and tracked changes from Word."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Jordan Gunn" }]
dependencies = ["lxml>=5.3,<7", "PyYAML>=6.0,<7"]

[project.scripts]
quarto-review = "quarto_review.cli:main"
quarto-review-pandoc = "quarto_review.pandoc_driver:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
    "websockets>=15,<18",
]
execution-tests = [
    "ipykernel>=7.3.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quarto_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires Pandoc or Quarto", "private: uses an explicitly supplied local Word fixture"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
